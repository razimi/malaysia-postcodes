services:
  postcodes-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postcodes-api
    ports:
      - "8000:8000"
    volumes:
      # Mount for development hot-reload
      - ./api:/app/api
      - ./api_keys.json:/app/api_keys.json:ro
    environment:
      - PORT=${PORT:-8000}
      - HOST=${HOST:-0.0.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_CLIENT_IP=${LOG_CLIENT_IP:-false}
      - API_KEYS_FILE=${API_KEYS_FILE:-api_keys.json}
      - DATA_FILE=${DATA_FILE:-all.json}
      - REQUIRE_API_KEY=${REQUIRE_API_KEY:-true}
      - RATE_LIMIT=${RATE_LIMIT:-100/minute}
      - IP_RATE_LIMIT=${IP_RATE_LIMIT:-1000/hour}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    restart: unless-stopped
    networks:
      - default
      - seda-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
networks:
  seda-net:
    driver: bridge
    external: true
      